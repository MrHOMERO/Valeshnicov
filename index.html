<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ajedrez Físico Asistido</title>
  
  <!-- Estilos e interfaz mobile-first -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 8px; text-align: center; color: #f0c040; }
    
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 280px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      margin-bottom: 12px;
    }
    
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .board-overlay {
      position: absolute;
      top: 10%;
      left: 10%;
      width: 80%;
      height: 80%;
      border: 2px dashed #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .board-overlay::after {
      content: "Alinea tu tablero de cristal aquí";
      color: #00ffcc;
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .status-panel {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 12px;
      border-left: 4px solid #f0c040;
    }

    .status-panel h2 { font-size: 1rem; color: #fff; }
    .status-panel p { font-size: 0.9rem; color: #aaa; margin-top: 4px; }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background-color: #2563eb; color: white; }
    .btn-secondary { background-color: #374151; color: white; }
    
    .move-input-box {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 1rem;
      text-transform: lowercase;
    }
  </style>

  <!-- Motores de ajedrez e integración CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

  <h1>Ajedrez Físico Asistido</h1>

  <!-- Vista previa de la cámara -->
  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="board-overlay"></div>
  </div>

  <!-- Panel de estado e instrucciones por voz -->
  <div class="status-panel">
    <h2 id="turn-status">Tu turno (Blancas)</h2>
    <p id="ai-response">Mueve una pieza física y regístrala abajo.</p>
  </div>

  <!-- Controles manuales rápidos para jugadas -->
  <div class="move-input-box">
    <input type="text" id="user-move" placeholder="Tu jugada (ej. e2e4, g1f3)" maxlength="5">
    <button class="btn-primary" onclick="makeUserMove()">Mover</button>
  </div>

  <div class="controls" style="margin-top: 10px;">
    <button class="btn-secondary" onclick="resetGame()">Reiniciar Partida</button>
  </div>

  <script>
    const game = new Chess();
    const video = document.getElementById('webcam');
    const turnStatus = document.getElementById('turn-status');
    const aiResponse = document.getElementById('ai-response');

    // 1. Iniciar cámara del celular
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Error al acceder a la cámara: ", err);
        aiResponse.innerText = "No se pudo acceder a la cámara. Permite los permisos.";
      }
    }

    // 2. Síntesis de Voz (Text-to-Speech en español)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // 3. Procesar jugada del usuario
    function makeUserMove() {
      const input = document.getElementById('user-move');
      const moveStr = input.value.trim().toLowerCase();
      
      if (!moveStr) return;

      const move = game.move({
        from: moveStr.substring(0, 2),
        to: moveStr.substring(2, 4),
        promotion: 'q'
      });

      if (move === null) {
        alert("Jugada no válida. Usa notación básica (ej: e2e4)");
        return;
      }

      input.value = '';
      turnStatus.innerText = "Pensando respuesta...";
      
      // Simulación de respuesta de la computadora / motor
      setTimeout(makeAIMove, 600);
    }

    // 4. Generar jugada del rival (IA) y anunciar por altavoz
    function makeAIMove() {
      const moves = game.moves({ verbose: true });
      if (game.game_over()) {
        turnStatus.innerText = "Fin de la partida";
        speak("La partida ha terminado.");
        return;
      }

      // Elige una jugada aleatoria de las válidas (para prueba rápida)
      const randomMove = moves[Math.floor(Math.random() * moves.length)];
      game.move(randomMove);

      const fromPiece = randomMove.from;
      const toPiece = randomMove.to;
      const textToSpeak = `Mi turno: Mueve de ${fromPiece} a ${toPiece}`;

      turnStatus.innerText = `Rival movió: ${fromPiece} a ${toPiece}`;
      aiResponse.innerText = `Ubica la pieza en tu tablero real.`;
      
      // Anuncio auditivo
      speak(textToSpeak);
    }

    function resetGame() {
      game.reset();
      turnStatus.innerText = "Tu turno (Blancas)";
      aiResponse.innerText = "Mueve una pieza física y regístrala abajo.";
      speak("Partida reiniciada. Tu mueves.");
    }

    // Inicializar al cargar
    window.addEventListener('load', initCamera);
  </script>
</body>
      </html>
