<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ajedrez Físico Asistido - Valeshnicov</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }
    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.3rem; color: #fbbf24; }
    p.subtitle { font-size: 0.8rem; color: #94a3b8; }
    .camera-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      aspect-ratio: 1;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    .instructions-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #38bdf8; font-size: 0.75rem; padding: 6px 12px;
      text-align: center; border-top: 1px solid rgba(255,255,255,0.1);
    }
    .status-card {
      width: 100%; max-width: 450px; background: #1e293b;
      padding: 12px; border-radius: 10px; margin: 10px 0;
      border-left: 4px solid #fbbf24; display: flex;
      justify-content: space-between; align-items: center;
    }
    .status-info h2 { font-size: 1rem; color: #f8fafc; }
    .status-info p { font-size: 0.85rem; color: #38bdf8; margin-top: 2px; font-weight: 600; }
    .virtual-board-container {
      width: 100%; max-width: 450px; background: #1e293b;
      border-radius: 10px; padding: 10px; margin-bottom: 12px;
    }
    .virtual-board-header { font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; text-align: center; }
    .chess-board {
      display: grid; grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr); aspect-ratio: 1;
      width: 100%; border: 2px solid #475569; border-radius: 6px; overflow: hidden;
    }
    .square {
      display: flex; justify-content: center; align-items: center;
      font-size: 1.6rem; cursor: pointer; user-select: none; position: relative;
    }
    .square.light { background-color: #e2e8f0; color: #0f172a; }
    .square.dark { background-color: #475569; color: #f8fafc; }
    .square.selected { background-color: #f59e0b !important; }
    .controls { display: flex; gap: 8px; width: 100%; max-width: 450px; margin-bottom: 20px; }
    button {
      flex: 1; padding: 10px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-secondary { background: #334155; color: white; }
    .btn-warning { background: #d97706; color: white; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
  <header>
    <h1>Ajedrez Asistido (Modo Aprendices)</h1>
    <p class="subtitle">Alineación con coordenadas en tiempo real</p>
  </header>
  <div class="camera-wrapper">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
    <div class="instructions-bar" id="instructionText">
      Toca las 4 esquinas del tablero físico en la pantalla para calibrar las coordenadas.
    </div>
  </div>
  <div class="status-card">
    <div class="status-info">
      <h2 id="turnText">Turno: Blancas</h2>
      <p id="lastMoveText">Alinea tu tablero e inicia la partida</p>
    </div>
    <button class="btn-warning" style="flex:0; padding: 8px 12px;" onclick="resetCorners()">Recalibrar</button>
  </div>
  <div class="virtual-board-container">
    <div class="virtual-board-header">Tablero Táctil de Control (Toca pieza y destino)</div>
    <div id="virtualBoard" class="chess-board"></div>
  </div>
  <div class="controls">
    <button class="btn-secondary" onclick="restartGame()">Reiniciar Partida</button>
  </div>
  <script>
    const game = new Chess();
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const instructionText = document.getElementById('instructionText');
    const turnText = document.getElementById('turnText');
    const lastMoveText = document.getElementById('lastMoveText');
    const virtualBoard = document.getElementById('virtualBoard');

    let corners = [];
    let selectedSquare = null;

    const pieceSymbols = {
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
    };

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          resizeCanvas();
          setDefaultCorners();
          requestAnimationFrame(drawOverlay);
        };
      } catch (err) {
        instructionText.innerText = "Error: Activa los permisos de la cámara en el navegador.";
      }
    }

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }

    function setDefaultCorners() {
      const w = canvas.width;
      const h = canvas.height;
      const pad = 40;
      corners = [
        { x: pad, y: pad },
        { x: w - pad, y: pad },
        { x: w - pad, y: h - pad },
        { x: pad, y: h - pad }
      ];
    }

    function resetCorners() {
      corners = [];
      instructionText.innerText = "Toca la esquina superior izquierda del tablero.";
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (corners.length < 4) {
        corners.push({ x, y });
        const labels = ["superior derecha", "inferior derecha", "inferior izquierda", "Completado"];
        if (corners.length < 4) {
          instructionText.innerText = `Ahora toca la esquina ${labels[corners.length - 1]}.`;
        } else {
          instructionText.innerText = "¡Calibración lista! Coordenadas proyectadas.";
        }
      } else {
        let nearestIdx = -1;
        let minDist = 30;
        corners.forEach((c, idx) => {
          const dist = Math.hypot(c.x - x, c.y - y);
          if (dist < minDist) {
            minDist = dist;
            nearestIdx = idx;
          }
        });
        if (nearestIdx !== -1) {
          corners[nearestIdx] = { x, y };
        }
      }
    });

    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (corners.length === 4) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(corners[0].x, corners[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
        ctx.closePath();
        ctx.stroke();

        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const u = (f + 0.5) / 8;
            const v = (r + 0.5) / 8;
            const pos = getPerspectivePoint(u, v, corners);

            if (r === 7) {
              const labelPos = getPerspectivePoint(u, 0.96, corners);
              ctx.fillStyle = '#fbbf24';
              ctx.font = 'bold 12px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(files[f].toUpperCase(), labelPos.x, labelPos.y);
            }
            if (f === 0) {
              const labelPos = getPerspectivePoint(0.04, v, corners);
              ctx.fillStyle = '#fbbf24';
              ctx.font = 'bold 12px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(ranks[r], labelPos.x, labelPos.y + 4);
            }

            ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      corners.forEach((c) => {
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(drawOverlay);
    }

    function getPerspectivePoint(u, v, pts) {
      const topX = pts[0].x + u * (pts[1].x - pts[0].x);
      const topY = pts[0].y + u * (pts[1].y - pts[0].y);
      const botX = pts[3].x + u * (pts[2].x - pts[3].x);
      const botY = pts[3].y + u * (pts[2].y - pts[3].y);
      return {
        x: topX + v * (botX - topX),
        y: topY + v * (botY - topY)
      };
    }

    function renderVirtualBoard() {
      virtualBoard.innerHTML = '';
      const board = game.board();
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      for (let r = 0; r < 8; r++) {
        for (let f = 0; f < 8; f++) {
          const squareName = files[f] + (8 - r);
          const squareEl = document.createElement('div');
          const isLight = (r + f) % 2 === 0;
          squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
          squareEl.dataset.square = squareName;

          const piece = board[r][f];
          if (piece) {
            const pieceKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
            squareEl.innerText = pieceSymbols[pieceKey] || '';
          }

          if (selectedSquare === squareName) {
            squareEl.classList.add('selected');
          }

          squareEl.addEventListener('click', () => handleSquareClick(squareName));
          virtualBoard.appendChild(squareEl);
        }
      }
    }

    function handleSquareClick(square) {
      if (!selectedSquare) {
        const piece = game.get(square);
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          renderVirtualBoard();
        }
      } else {
        const move = game.move({
          from: selectedSquare,
          to: square,
          promotion: 'q'
        });

        if (move !== null) {
          selectedSquare = null;
          renderVirtualBoard();
          updateStatus();
          speakMove(`Jugaste ${move.piece.toUpperCase()} a ${square}`);
          
          if (!game.game_over()) {
            turnText.innerText = "Turno: Rival pensando...";
            setTimeout(makeAIMove, 700);
          }
        } else {
          selectedSquare = null;
          renderVirtualBoard();
        }
      }
    }

    function makeAIMove() {
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      const randomMove = moves[Math.floor(Math.random() * moves.length)];
      game.move(randomMove);
      renderVirtualBoard();
      updateStatus();

      const voiceMsg = `Rival mueve de ${randomMove.from} a ${randomMove.to}`;
      lastMoveText.innerText = `Rival movió: ${randomMove.from} → ${randomMove.to}`;
      speakMove(voiceMsg);
    }

    function updateStatus() {
      if (game.in_checkmate()) {
        turnText.innerText = "¡Jaque Mate!";
        speakMove("Jaque mate. Fin de la partida.");
      } else if (game.in_draw()) {
        turnText.innerText = "Tablas (Empate)";
      } else {
        turnText.innerText = game.turn() === 'w' ? "Turno: Tu turno (Blancas)" : "Turno: Rival (Negras)";
      }
    }

    function speakMove(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    function restartGame() {
      game.reset();
      selectedSquare = null;
      renderVirtualBoard();
      turnText.innerText = "Turno: Blancas";
      lastMoveText.innerText = "Partida reiniciada";
      speakMove("Nueva partida lista. Tu mueves.");
    }

    window.addEventListener('load', () => {
      initCamera();
      renderVirtualBoard();
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
